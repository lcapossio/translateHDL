#
# The lint gate is pinned to an EXPLICIT rule set on purpose. Ruff's implicit
# default set widens between releases (0.16 turned on I/RUF/FURB/PL families
# that 0.5 did not), which silently turned CI's `ruff check scripts tests` red
# without a line of this repo changing. Naming the rules here means the gate
# means the same thing on every ruff >= the pin in requirements.txt.
#
# The set is what this codebase already writes to - the `# noqa: BLE001` and
# `# noqa: PLC0415` directives in scripts/ are evidence of intent, so those
# rules are enabled rather than left off (RUF100 then keeps the directives
# honest: an unused noqa is itself an error).
line-length = 100

[lint]
select = [
    "E4", "E7", "E9",   # pycodestyle: imports, statements, syntax
    "F",                # pyflakes
    "I",                # import sorting
    "BLE",              # blind except
    "PLC0415",          # import outside top level
    "PLW",              # pylint warnings (incl. subprocess without `check`)
    "RUF046", "RUF100",
    "FURB",
    "TRY004", "TRY203",
]
